name: Announce release on Discord
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (empty = the latest release)
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then REL=$(gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,body,isPrerelease)
          else REL=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,body,isPrerelease); fi
          [ "$(jq -r .isPrerelease <<<"$REL")" = "true" ] && { echo "pre-release, not announced"; exit 0; }
          TAG=$(jq -r .tagName <<<"$REL")
          BODY=$(jq -r .body <<<"$REL")
          jq -n --arg tag "$TAG" --arg body "${BODY:0:3300}" \
            '{embeds:[{
              title: ("MTGA Forge " + $tag),
              description: ($body + "\n\nPlease update to this version for the latest fixes on **mtgaforge.com**."),
              color: 5793266
            }]}' \
          | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"

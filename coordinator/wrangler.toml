name = "mm"
main = "src/index.ts"
compatibility_date = "2025-01-01"
preview_urls = false

[[durable_objects.bindings]]
name = "QUEUE"
class_name = "Queue"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "CHALLENGE"
class_name = "Challenge"

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Queue", "Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Challenge"]

# Accounts: names, tags, device keys (schema in migrations/, apply with `npm run db:migrate`).
[[d1_databases]]
binding = "DB"
database_name = "mtga-forge"
database_id = "3f6f6bd1-3851-46d9-9406-9f52ab6f7c67"
migrations_dir = "migrations"

# Secret for the match tokens and session tokens: `npx wrangler secret put TOKEN_SECRET` (a default is used under `wrangler dev`).
